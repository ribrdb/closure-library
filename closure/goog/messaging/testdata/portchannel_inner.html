<head>
<title>PortChannel test inner document</title>
<script>
  var CLOSURE_DEFINES = CLOSURE_DEFINES || {};
  CLOSURE_DEFINES["goog.ENABLE_DEBUG_LOADER"]=true;
</script>

<script src="../../base.js"></script>

<body>
<script type=module>
import { PortChannel } from '../portchannel.js';

var peerOrigin = window.location.protocol + '//' + window.location.host;
var channel = PortChannel.forGlobalWindow(peerOrigin);
channel.registerService('ping', function(msg) {
  channel.send('pong', msg);
});

</script>
</body>
