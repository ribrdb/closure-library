<script type=module>
import { PortCaller } from '../portcaller.js';
import { PortChannel } from '../portchannel.js';
console.log('portnetwork_inner')
var peerOrigin = window.location.protocol + '//' + window.location.host;
var caller = new PortCaller(
    PortChannel.forGlobalWindow(peerOrigin));

caller.dial('worker2').registerService('sendToWorker1', function(msg) {
console.log('frame: sendToWorker1');
  msg.push('frame');
  caller.dial('worker1').send('sendToMain', msg);
}, true);

</script>
